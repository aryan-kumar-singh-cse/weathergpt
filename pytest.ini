[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = backend/tests

# Asyncio mode for pytest-asyncio
asyncio_mode = auto

# Console output options
console_output_style = progress
addopts =
    --verbose
    --strict-markers
    --disable-warnings
    -ra
    --cov=backend
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml

# Coverage settings
[coverage:run]
source = backend
omit =
    */tests/*
    */conftest.py
    */__init__.py
    */venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
