# WeatherGPT - Complete Docker Compose Configuration
# Includes: Backend API (FastAPI) and Frontend (Next.js 14)
# For Smart India Hackathon (SIH 2026)

version: '3.8'

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: weathergpt-backend
    ports:
      - "8000:8000"
    environment:
      # Zero-Config Shared Team Keys
      GROQ_API_KEY: ${GROQ_API_KEY:-${LLM_PRIMARY_API_KEY:-}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${LLM_SECONDARY_API_KEY:-}}
      LLM_PRIMARY_API_KEY: ${GROQ_API_KEY:-${LLM_PRIMARY_API_KEY:-}}
      LLM_SECONDARY_API_KEY: ${GEMINI_API_KEY:-${LLM_SECONDARY_API_KEY:-}}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-llama-3.1-70b-versatile}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-gemini-2.0-flash}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_SECONDARY_BASE_URL: ${LLM_SECONDARY_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}

      # Database Configuration (SQLite by default)
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/weathergpt.db}

      # API Configuration & Rate Limiting
      API_SECRET_KEY: ${API_SECRET_KEY:-weathergpt-secret-key-change-in-production}
      API_DEBUG: ${API_DEBUG:-false}
      MAX_QUESTIONS_PER_DAY: ${MAX_QUESTIONS_PER_DAY:-20}

      # Voice Configuration
      STT_PROVIDER: ${STT_PROVIDER:-groq}
      TTS_PROVIDER: ${TTS_PROVIDER:-web}

    volumes:
      - ./data:/app/data

    networks:
      - weathergpt-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

  # Frontend (Next.js 14)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: weathergpt-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      INTERNAL_API_URL: http://backend:8000/api/v1

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - weathergpt-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

networks:
  weathergpt-network:
    driver: bridge
