# Docker Compose for local development
# For WSL2 or environments without Docker Desktop
#
# Local Development Instructions:
# 1. Install Python: pip install -r requirements.txt
# 2. Start backend: uvicorn backend.api.main:app --reload --host 0.0.0.0 --port 8000
# 3. Start frontend: cd frontend/web && npm install && npm run dev
# 4. Or use Docker: docker-compose -f docker-compose.local.yml up

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: weathergpt-backend-local
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.api.main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped

  postgres:
    image: timescaledb:latest-pg16
    container_name: weathergpt-postgres-local
    environment:
      POSTGRES_USER: weathergpt
      POSTGRES_PASSWORD: weathergpt_password
      POSTGRES_DB: weathergpt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: weathergpt-redis-local
    ports:
      - "6379:6379"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: weathergpt-frontend-local
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend/web:/app
    depends_on:
      - backend
    command: npm run dev
    restart: unless-stopped

volumes:
  postgres_data:
